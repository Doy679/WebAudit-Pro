<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Problems</title>
  <link rel="canonical" href="{{origin}}/somewhere-else/">
  <style>
    body { margin: 0; font: 16px/1.6 sans-serif; }
    section { padding: 48px 24px; }
    .wide { width: 600px; height: 40px; background: #eee; }
    .tiny { display: inline-block; padding: 2px 6px; font-size: 13px; background: #0a3d91; color: #fff; text-decoration: none; }
    .clip { height: 24px; overflow: hidden; width: 120px; font-size: 20px; line-height: 24px; }
    .wrapbtn { display: inline-block; width: 90px; padding: 10px; background: #0a3d91; color: #fff; text-decoration: none; }
    .faint { color: #bbb; background: #fff; }
    .legal { font-size: 9px; }
  </style>
</head>
<body>
  <main>
    <section><h2 class="clip">This heading is far too long for its box</h2></section>
    <section><div class="wide" id="wide-box"></div></section>
    <section><a class="tiny" href="/x">Go</a> <a class="wrapbtn" href="#">Get pre-approved today</a></section>
    <section><p class="faint">Low contrast text here.</p><p class="legal">Tiny legal copy.</p></section>
  </main>
</body>
</html>
